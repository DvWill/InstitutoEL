<!doctype html>
<!--
  Imagem de compartilhamento do site (a que aparece quando o link é enviado no
  WhatsApp e em outras redes): 1200x630, só com a logo do Instituto, grande.

  A logo ocupa quase todo o quadrado central (630x630), porque o WhatsApp corta
  a imagem em quadrado na miniatura pequena e a mostra em baixa resolução:
  quanto maior a logo, mais legível ela fica ali. Não há texto na imagem; o
  título e a descrição já aparecem ao lado, vindos das tags da página.
  As laterais só aparecem na prévia grande e têm apenas elementos decorativos.

  Para gerar de novo, na raiz do projeto (Edge ou Chrome):
    msedge --headless=new --hide-scrollbars --window-size=1200,630
      --force-device-scale-factor=2 --screenshot=og.png assets/og/compartilhamento.html
  Depois reduza para 1200x630 e salve em JPEG (qualidade alta, sem redução de
  cor) como app/opengraph-image.jpg e app/twitter-image.jpg. O WhatsApp ignora
  imagens pesadas: mantenha abaixo de 300 KB.
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Imagem de compartilhamento</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --navy: #062a5e;
        --navy-deep: #03163a;
        --yellow: #fdb913;
        --yellow-soft: #ffd564;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--navy-deep);
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(
            circle 520px at 50% 50%,
            rgba(253, 185, 19, 0.26),
            transparent 72%
          ),
          radial-gradient(
            circle 520px at 0% 100%,
            rgba(13, 74, 154, 0.9),
            transparent 70%
          ),
          radial-gradient(
            circle 520px at 100% 0%,
            rgba(13, 74, 154, 0.75),
            transparent 70%
          ),
          linear-gradient(
            160deg,
            #0a3f87 0%,
            var(--navy) 48%,
            var(--navy-deep) 100%
          );
      }
      /* Órbitas em volta da logo, como no topo do site. */
      .orbits {
        position: absolute;
        top: 0;
        left: 0;
      }
      /* Selo branco com a logo: ocupa quase toda a altura da imagem. */
      .seal {
        position: absolute;
        top: 41px;
        left: 330px;
        display: grid;
        width: 540px;
        height: 540px;
        place-items: center;
        border-radius: 50%;
        background: #fff;
        box-shadow:
          0 0 0 14px rgba(255, 255, 255, 0.16),
          0 34px 70px rgba(1, 10, 30, 0.6);
      }
      .seal img {
        display: block;
        width: 444px;
        height: 444px;
        object-fit: contain;
      }
      .bar {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 6px;
        background: linear-gradient(
          90deg,
          var(--yellow) 0%,
          var(--yellow-soft) 50%,
          var(--yellow) 100%
        );
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg
        class="orbits"
        width="1200"
        height="630"
        viewBox="0 0 1200 630"
        fill="none"
      >
        <circle
          cx="600"
          cy="311"
          r="306"
          stroke="rgba(255,255,255,0.3)"
          stroke-width="1.5"
          stroke-dasharray="3 9"
        />
        <circle
          cx="600"
          cy="311"
          r="382"
          stroke="rgba(253,185,19,0.65)"
          stroke-width="1.5"
        />
        <circle
          cx="600"
          cy="311"
          r="470"
          stroke="rgba(255,255,255,0.16)"
          stroke-width="1.5"
        />
        <circle
          cx="600"
          cy="311"
          r="570"
          stroke="rgba(255,255,255,0.09)"
          stroke-width="1.5"
        />
        <circle cx="241" cy="180" r="9" fill="#fdb913" />
        <circle cx="959" cy="441" r="9" fill="#fdb913" />
        <circle cx="158" cy="472" r="6" fill="#fff" fill-opacity="0.9" />
        <circle cx="1042" cy="150" r="6" fill="#fff" fill-opacity="0.9" />
        <circle cx="231" cy="402" r="5" fill="#fdb913" fill-opacity="0.85" />
        <circle cx="969" cy="220" r="5" fill="#fdb913" fill-opacity="0.85" />
        <circle cx="62" cy="214" r="4" fill="#fff" fill-opacity="0.55" />
        <circle cx="1138" cy="408" r="4" fill="#fff" fill-opacity="0.55" />
      </svg>
      <div class="seal">
        <img src="../originais/instituto-logo.png" alt="" />
      </div>
      <div class="bar"></div>
    </div>
  </body>
</html>
