<!doctype html>
<!--
  Imagem de compartilhamento do site (a que aparece quando o link é enviado no
  WhatsApp e em outras redes): 1200x630, com a logo do Instituto em destaque.

  O conteúdo importante fica no quadrado central (630x630), porque o WhatsApp
  Web corta a imagem em quadrado na miniatura. As laterais só aparecem na
  prévia grande e têm apenas elementos decorativos.

  Para gerar de novo, na raiz do projeto (Edge ou Chrome):
    msedge --headless=new --hide-scrollbars --window-size=1200,630
      --force-device-scale-factor=2 --screenshot=og.png assets/og/compartilhamento.html
  Depois reduza para 1200x630 e salve em JPEG como app/opengraph-image.jpg e
  app/twitter-image.jpg (o WhatsApp ignora imagens muito pesadas; mantenha
  abaixo de 300 KB).
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Imagem de compartilhamento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&family=Sora:wght@600;700&display=block"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --navy: #062a5e;
        --navy-deep: #03163a;
        --blue: #0d4a9a;
        --yellow: #fdb913;
        --yellow-soft: #ffd564;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--navy-deep);
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(
            circle 460px at 50% 40%,
            rgba(253, 185, 19, 0.22),
            transparent 70%
          ),
          radial-gradient(
            circle 520px at 0% 100%,
            rgba(13, 74, 154, 0.9),
            transparent 70%
          ),
          radial-gradient(
            circle 520px at 100% 0%,
            rgba(13, 74, 154, 0.75),
            transparent 70%
          ),
          linear-gradient(
            160deg,
            #0a3f87 0%,
            var(--navy) 48%,
            var(--navy-deep) 100%
          );
        color: #fff;
        font-family: Inter, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* Órbitas em volta da logo, como no topo do site. */
      .orbits {
        position: absolute;
        top: 0;
        left: 0;
        /* As linhas somem antes do texto, para não cruzar as letras. */
        -webkit-mask-image: linear-gradient(
          180deg,
          #000 0%,
          #000 66%,
          transparent 76%
        );
        mask-image: linear-gradient(180deg, #000 0%, #000 66%, transparent 76%);
      }
      /* Selo branco com a logo: o elemento principal da imagem. */
      .seal {
        position: absolute;
        top: 46px;
        left: 395px;
        display: grid;
        width: 410px;
        height: 410px;
        place-items: center;
        border-radius: 50%;
        background: #fff;
        box-shadow:
          0 0 0 14px rgba(255, 255, 255, 0.16),
          0 34px 70px rgba(1, 10, 30, 0.6);
      }
      .seal img {
        display: block;
        width: 330px;
        height: 330px;
        object-fit: contain;
      }
      h1 {
        position: absolute;
        top: 496px;
        right: 0;
        left: 0;
        font:
          700 28px/1.15 Sora,
          Arial,
          sans-serif;
        letter-spacing: -0.03em;
        text-align: center;
        text-shadow: 0 4px 24px rgba(1, 10, 30, 0.6);
      }
      h1 em {
        color: var(--yellow);
        font-style: normal;
      }
      .steps {
        position: absolute;
        top: 552px;
        right: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 13px;
        color: #d5e3fa;
        font:
          700 13px/1 Inter,
          Arial,
          sans-serif;
        letter-spacing: 0.17em;
        text-transform: uppercase;
      }
      .steps i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--yellow);
      }
      .bar {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 8px;
        background: linear-gradient(
          90deg,
          var(--yellow) 0%,
          var(--yellow-soft) 50%,
          var(--yellow) 100%
        );
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg
        class="orbits"
        width="1200"
        height="630"
        viewBox="0 0 1200 630"
        fill="none"
      >
        <circle
          cx="600"
          cy="251"
          r="262"
          stroke="rgba(255,255,255,0.3)"
          stroke-width="1.5"
          stroke-dasharray="3 9"
        />
        <circle
          cx="600"
          cy="251"
          r="330"
          stroke="rgba(253,185,19,0.6)"
          stroke-width="1.5"
        />
        <circle
          cx="600"
          cy="251"
          r="440"
          stroke="rgba(255,255,255,0.14)"
          stroke-width="1.5"
        />
        <circle
          cx="600"
          cy="251"
          r="560"
          stroke="rgba(255,255,255,0.08)"
          stroke-width="1.5"
        />
        <circle
          cx="600"
          cy="251"
          r="690"
          stroke="rgba(255,255,255,0.05)"
          stroke-width="1.5"
        />
        <circle cx="314" cy="86" r="8" fill="#fdb913" />
        <circle cx="917" cy="343" r="6" fill="#fdb913" />
        <circle cx="862" cy="251" r="5" fill="#fff" fill-opacity="0.9" />
        <circle cx="372" cy="380" r="5" fill="#fff" fill-opacity="0.85" />
        <circle cx="177" cy="372" r="6" fill="#fdb913" fill-opacity="0.85" />
        <circle cx="1030" cy="158" r="6" fill="#fdb913" fill-opacity="0.85" />
        <circle cx="94" cy="130" r="4" fill="#fff" fill-opacity="0.55" />
        <circle cx="1118" cy="430" r="4" fill="#fff" fill-opacity="0.55" />
      </svg>
      <div class="seal">
        <img src="../originais/instituto-logo.png" alt="" />
      </div>
      <h1>Formação de gestores <em>para redes de ensino</em></h1>
      <p class="steps">
        Formação<i></i>Estratégia<i></i>Acompanhamento<i></i>Resultados
      </p>
      <div class="bar"></div>
    </div>
  </body>
</html>
